name: CD — Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["CI — Build & Push AssetLedger"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target overlay (dev or prod)
        required: true
        default: prod
        type: choice
        options: [dev, prod]
      image_tag:
        description: Image tag to deploy (sha or latest)
        required: true
        default: latest

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/assetledger

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Ensure AUTH_SECRET exists
        run: |
          kubectl get ns assetledger >/dev/null 2>&1 || kubectl create ns assetledger
          if ! kubectl -n assetledger get secret assetledger-secrets >/dev/null 2>&1; then
            kubectl -n assetledger create secret generic assetledger-secrets \
              --from-literal=AUTH_SECRET="$(openssl rand -hex 32)"
          fi

      - name: Deploy with Kustomize
        env:
          OVERLAY: ${{ github.event.inputs.environment || 'prod' }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          OWNER_IMAGE="${REGISTRY}/${IMAGE_NAME}"
          # Rewrite placeholder image in overlay
          cd "deploy/k8s/overlays/${OVERLAY}"
          kustomize edit set image "ghcr.io/OWNER/assetledger=${OWNER_IMAGE}:${TAG}"
          kubectl apply -k .
          kubectl -n assetledger rollout status deployment/assetledger --timeout=180s

      - name: Smoke test health
        run: |
          kubectl -n assetledger wait --for=condition=ready pod \
            -l app.kubernetes.io/name=assetledger --timeout=120s
          POD=$(kubectl -n assetledger get pod -l app.kubernetes.io/name=assetledger -o jsonpath='{.items[0].metadata.name}')
          kubectl -n assetledger exec "$POD" -- \
            node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1))"
