# Do not commit real secrets. Create at deploy time:
#   kubectl -n assetledger create secret generic assetledger-secrets \
#     --from-literal=AUTH_SECRET="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: assetledger-secrets
  namespace: assetledger
  labels:
    app.kubernetes.io/name: assetledger
type: Opaque
stringData:
  AUTH_SECRET: "replace-me-before-production"
