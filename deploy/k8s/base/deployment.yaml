apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetledger
  namespace: assetledger
  labels:
    app.kubernetes.io/name: assetledger
    app.kubernetes.io/component: web
spec:
  # SQLite supports one writer. Keep a single replica.
  replicas: 1
  # Recreate avoids two pods mounting the same RWO volume during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: assetledger
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assetledger
        app.kubernetes.io/component: web
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: app
          image: ghcr.io/OWNER/assetledger:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: assetledger-config
            - secretRef:
                name: assetledger-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: assetledger-data
